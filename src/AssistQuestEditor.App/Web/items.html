<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предметы</title>
<link rel="stylesheet" href="theme.css?v=b329b3ea">
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#0d1014; }
  .itemsWindow {
    height:100%;
    box-sizing:border-box;
    padding:8px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .itemsHead {
    flex:0 0 auto;
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:2px 2px 8px;
  }
  .itemsHead strong { font-size:14px; }
  .itemsHead .itemsHint { color:var(--muted); font-size:11px; }
  .itemsSearch {
    margin-left:auto;
    background:#0f141a;
    color:#e9edf2;
    border:1px solid var(--border);
    border-radius:4px;
    padding:3px 6px;
    font-size:12px;
    width:180px;
  }
  /* Галочка «только съедобное» рядом с поиском (требование автора). Отделена от
     поля поиска отступом: это ФИЛЬТР ПОКАЗА, а не часть запроса, и слипшись с
     полем он читался бы как его подпись. */
  .itemsEdibleFilter {
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:#e9edf2;
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
  }
  .itemsEdibleFilter input { cursor:pointer; margin:0; }
  /* Салатовая плашка «съедобно». Цвет отдельный от акцента: акцент означает
     выделение из журнала, а плашка — свойство предмета, и путать их нельзя. */
  .itemEdibleBadge {
    font-size:10px;
    font-weight:600;
    color:#0f1a12;
    background:#8fe08a;
    border-radius:3px;
    padding:1px 5px;
    white-space:nowrap;
  }
  /* Каталог — ОДНА колонка с вертикальной прокруткой (прямое требование
     автора). Ширина окна сокращена вдвое, поэтому карточки растягиваются на всю
     клиентскую ширину (minmax(0,1fr) — нижняя граница 0 обязательна, иначе
     длинное слово в описании задаёт минимальную ширину и появляется
     ГОРИЗОНТАЛЬНАЯ прокрутка). Текст переносится, а не обрезается. */
  .itemsBody {
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:8px;
    align-content:start;
  }

  .itemCard {
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px;
    background:rgba(255,255,255,.02);
    display:flex;
    gap:8px;
  }
  /* Выделение предмета, на который сослались из журнала. */
  .itemCard.itemHighlight {
    border-color:var(--accent);
    background:rgba(120,190,255,.14);
    box-shadow:0 0 0 2px rgba(120,190,255,.25);
  }
  /* Плитка 48×48: реального изображения у предметов нет, поэтому цвет с буквой
     (прямое указание автора — новые ресурсы не генерировать). */
  .itemTile {
    flex:0 0 48px;
    width:48px;
    height:48px;
    border-radius:5px;
    border:1px solid rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:700;
    color:rgba(15,18,22,.82);
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    user-select:none;
  }
  /* min-width:0 + overflow-wrap у детей: одна колонка узкая, и без них длинный
     ID или описание без пробелов растянули бы строку за окно (горизонтальная
     прокрутка запрещена автором) — перенос обязателен. */
  .itemMain { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:4px; overflow-wrap:anywhere; }
  .itemTitle { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .itemName { font-size:13px; font-weight:600; overflow-wrap:anywhere; }
  .itemCategory { font-size:11px; color:var(--muted); }
  .itemDescription { font-size:11px; line-height:1.45; color:rgba(233,237,242,.82); overflow-wrap:anywhere; }
  .itemNutrition { font-size:11px; line-height:1.5; }
  .itemNutrition .itemNutritionLabel { color:var(--muted); }
  /* БЖУ и атрибуты — те же строки мелкого текста, но с ВЕРХНЕЙ ЛИНИЕЙ: они
     рассказывают о составе и качестве, а не о том, что предмет даёт шкалам, и
     без разделителя читались бы как продолжение пищевой ценности. */
  .itemMacros { font-size:11px; line-height:1.5; }
  .itemMacros .itemNutritionLabel { color:var(--muted); }
  .itemAttributes {
    font-size:11px;
    line-height:1.5;
    color:var(--muted);
    border-top:1px solid var(--border);
    margin-top:3px;
    padding-top:3px;
  }
  /* Цена позиции. Отдельная строка и отдельный цвет: это не пищевая ценность и
     не свойство предмета, а ЕГО СТОИМОСТЬ, и слипшись с «Пищевой ценностью»
     строка читалась бы как ещё одна характеристика еды. */
  .itemPrice { font-size:11px; line-height:1.5; color:#e8c46a; }
  .itemFooter { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .itemQtyInput {
    width:56px;
    background:#0f141a;
    color:#e9edf2;
    border:1px solid var(--border);
    border-radius:4px;
    padding:2px 4px;
    font-size:12px;
    text-align:right;
  }
  /* Микрокнопки «+» и «−»: их по две на предмет, и крупные кнопки превратили бы
     каталог в стену. */
  .itemMicro {
    width:22px;
    height:20px;
    padding:0;
    font-size:14px;
    line-height:1;
    background:rgba(255,255,255,.06);
    color:#e9edf2;
    border:1px solid var(--border);
    border-radius:4px;
    cursor:pointer;
  }
  .itemMicro:hover:not([disabled]) { background:rgba(255,255,255,.14); }
  .itemMicro:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .itemMicro[disabled] { opacity:.4; cursor:not-allowed; }
  .itemInInventory { font-size:11px; color:var(--muted); }
  .itemsEmpty { font-size:12px; color:var(--muted); padding:8px; }
  .itemsError { flex:0 0 auto; font-size:11px; color:#ff9a9a; min-height:12px; padding:0 2px 4px; }
</style>
</head>
<body>
<div class="itemsWindow">
  <div class="itemsHead">
    <strong>Предметы</strong>
    <span class="itemsHint">каталог симулятора: количество по умолчанию 0, «+» и «−» меняют запас на единицу</span>
    <input class="itemsSearch" id="itemsSearch" type="search" placeholder="поиск по названию" aria-label="Поиск предмета">
    <label class="itemsEdibleFilter" title="Показать только предметы, которые можно употребить">
      <input type="checkbox" id="itemsOnlyEdible" aria-label="Только съедобное">
      <span>только съедобное</span>
    </label>
    <!-- Две обратные галочки рядом: «несъедобное» и «квестовое». Все три
         фильтруют ОДИН список, поэтому каждая подписана своим словом, а не
         «фильтр 2/3»: подписи читаются без подсказки. -->
    <label class="itemsEdibleFilter" title="Показать только предметы, которые не употребляют в пищу">
      <input type="checkbox" id="itemsOnlyInedible" aria-label="Только несъедобное">
      <span>только несъедобное</span>
    </label>
    <label class="itemsEdibleFilter" title="Показать только предметы, которые выдают квесты и которые никогда не продаются">
      <input type="checkbox" id="itemsOnlyQuest" aria-label="Квестовое">
      <span>квестовое</span>
    </label>
  </div>
  <div class="itemsError" id="itemsError"></div>
  <div class="itemsBody" id="itemsBody"></div>
</div>
<script src="web_log.js?v=18763af3"></script>
<script src="dom_reconcile.js?v=b4a5a022"></script>
<script src="vitals.js?v=41571d6f"></script>
<script src="items.js?v=a18ee556"></script>
</body>
</html>
