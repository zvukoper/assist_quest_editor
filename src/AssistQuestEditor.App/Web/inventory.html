<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игрок</title>
<link rel="stylesheet" href="theme.css?v=b329b3ea">
<style>
  html, body { height:100%; margin:0; overflow:hidden; }
  .playerWindow {
    height:100%;
    box-sizing:border-box;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 290px;
    gap:10px;
    padding:8px;
    background:#0d1014;
  }
  .playerInventoryColumn,
  .playerInfoColumn {
    min-width:0;
    min-height:0;
    overflow:hidden;
  }
  .playerInventoryColumn .gamePanel,
  .playerInfoColumn .gamePanel {
    height:100%;
    box-sizing:border-box;
    border-radius:6px;
  }
  .playerInventoryColumn .gamePanel {
    overflow:hidden;
  }
  .playerInfoColumn .gamePanel {
    display:flex;
    flex-direction:column;
  }
  .playerWindowTabs {
    flex:0 0 auto;
    padding:6px 8px 0;
  }
  .playerWindowTabBody {
    flex:1 1 auto;
    min-height:0;
    overflow:auto;
    padding:8px;
  }
</style>
</head>
<body>
<div class="playerWindow">
  <section class="playerInventoryColumn">
    <section class="gamePanel inventoryPanel" id="inventoryPanel"></section>
  </section>

  <section class="playerInfoColumn">
    <section class="gamePanel playerInfoPanel" id="playerInfoPanel"></section>
  </section>
</div>

<div class="inventoryNotifications" id="inventoryNotifications" aria-live="polite"></div>

<script src="vitals.js?v=c48bd86b"></script>
<script src="inventory.js?v=85fe82ff"></script>
<script src="playerPanels.js?v=e2c1841d"></script>
<script>
(function () {
  "use strict";

  var panel = document.getElementById("inventoryPanel");
  var playerInfoPanel = document.getElementById("playerInfoPanel");
  var notifications = document.getElementById("inventoryNotifications");
  var snapshot = null;
  var catalog = [];
  var activePlayerTab = "character";

  var seenItemIds = new Set();

  function render() {
    if (!panel || !playerInfoPanel) return;

    if (!snapshot) {
      panel.innerHTML =
        "<div class='gamePanelHeader'><div><div class='gamePanelTitle'>Инвентарь</div>" +
        "<div class='gamePanelSub'>Ожидание данных от Симулятора</div></div></div>" +
        "<div class='notice' style='margin:12px'>Окно обновляется, пока открыт Симулятор.</div>";

      playerInfoPanel.innerHTML =
        "<div class='gamePanelHeader'><div class='gamePanelTitle'>Игрок</div></div>" +
        "<div class='notice' style='margin:12px'>Ожидание данных от Симулятора.</div>";
      return;
    }

    panel.innerHTML = AssistInventory.panelMarkup(snapshot, catalog, {
      seenItemIds: seenItemIds,
      withHeader: true,
      hotkeyHint: "I — открыть / закрыть"
    });

    AssistPlayerPanels.renderTabs(
      playerInfoPanel,
      snapshot,
      activePlayerTab,
      function (next) {
        activePlayerTab = next;
        render();
      });

    panel.querySelectorAll("[data-inventory-item]").forEach(function (button) {
      // ЛКМ по предмету ничего не делает (требование автора): использование —
      // ТОЛЬКО через меню ПКМ. Подсказки «ЛКМ — использовать» больше нет, она
      // обещала действие, которого не будет.
      button.addEventListener("mouseenter", function () {
        var id = String(button.dataset.inventoryItem || "").toLowerCase();
        if (!id || seenItemIds.has(id)) return;

        seenItemIds.add(id);
        send({ action: "mark_inventory_seen", itemId: id });

        // Перерисовка ЗДЕСЬ была причиной мерцания подсветки: render() заменял
        // узлы под курсором, новый узел снова получал mouseenter, и цикл
        // повторялся — подсветка мигала. Снимаем только значок «новый» у
        // конкретной кнопки, остальное содержимое не трогаем.
        var dot = button.querySelector(".inventoryNewDot");
        if (dot) dot.remove();
      });
    });

    panel.querySelectorAll("[data-inventory-item]").forEach(function (button) {
      button.addEventListener("contextmenu", function (event) {
        event.preventDefault();
        event.stopPropagation();

        var id = String(button.dataset.inventoryItem || "").toLowerCase();
        if (!id) return;

        openInventoryMenu(button, id);
      });
    });
  }

  /**
   * Меню ПКМ по предмету: «Использовать» и «Выбросить».
   *
   * Меню ОДНО на окно и переиспользуется: своя копия на каждый предмет плодила
   * бы узлы и слушатели, которые оставались бы после перерисовки сетки. Пункты
   * ровно два, как просил автор; ЛКМ по предмету, в отличие от прежнего
   * поведения, не делает ничего.
   */
  function openInventoryMenu(button, itemId) {
    var menu = document.getElementById("inventoryContextMenu");
    if (!menu) {
      menu = document.createElement("div");
      menu.id = "inventoryContextMenu";
      menu.className = "graphContextMenu inventoryContextMenu";
      menu.hidden = true;
      menu.innerHTML =
        "<div class='graphContextMenuTitle'>Предмет</div>" +
        "<div class='graphContextMenuHint' data-inventory-menu-name></div>" +
        "<button class='graphContextMenuItem' type='button' data-inventory-menu-action='use'>Использовать</button>" +
        "<button class='graphContextMenuItem' type='button' data-inventory-menu-action='drop'>Выбросить</button>";
      document.body.appendChild(menu);

      menu.addEventListener("click", function (event) {
        var target = event.target && event.target.closest
          ? event.target.closest("[data-inventory-menu-action]")
          : null;
        if (!target) return;

        var action = target.getAttribute("data-inventory-menu-action");
        var id = menu.dataset.inventoryItemId || "";
        hideInventoryMenu();
        if (!id) return;

        send({
          action: action === "drop" ? "drop_inventory_item" : "use_inventory_item",
          itemId: id
        });
      });
    }

    var item = AssistInventory.itemDefinition(catalog, itemId);
    var name = menu.querySelector("[data-inventory-menu-name]");
    if (name)
      name.textContent = (item.name || itemId) + " ×" +
        Number((snapshot.inventory.items || {})[itemId] || 0);

    menu.dataset.inventoryItemId = itemId;
    menu.hidden = false;

    // Позиция — по курсору, с зажимом в границах окна: меню у нижней кромки
    // иначе уходило бы за экран, и «Выбросить» было бы недостижимо.
    var rect = button.getBoundingClientRect();
    var width = menu.offsetWidth || 205;
    var height = menu.offsetHeight || 120;
    menu.style.left = Math.max(4, Math.min(window.innerWidth - width - 4, rect.left)) + "px";
    menu.style.top = Math.max(4, Math.min(window.innerHeight - height - 4, rect.bottom + 2)) + "px";
  }

  function hideInventoryMenu() {
    var menu = document.getElementById("inventoryContextMenu");
    if (menu) menu.hidden = true;
  }

  // Закрытие меню: ЛКМ мимо него и Escape. Без этого меню оставалось бы висеть
  // поверх сетки и перекрывало соседние ячейки до следующего ПКМ.
  //
  // Escape здесь перехватывается В ФАЗЕ ПОГРУЖЕНИЯ и не доходит до обработчика
  // «Escape закрывает окно»: при открытом меню игрок ждёт закрытия МЕНЮ, а не
  // всего окна инвентаря.
  document.addEventListener("pointerdown", function (event) {
    var menu = document.getElementById("inventoryContextMenu");
    if (!menu || menu.hidden) return;
    if (event.target && event.target.closest && event.target.closest("#inventoryContextMenu"))
      return;
    hideInventoryMenu();
  }, true);

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    var menu = document.getElementById("inventoryContextMenu");
    if (!menu || menu.hidden) return;
    hideInventoryMenu();
    event.preventDefault();
    event.stopPropagation();
  }, true);

  window.addEventListener("blur", hideInventoryMenu);
  window.addEventListener("resize", hideInventoryMenu);

  function send(payload) {
    try {
      if (window.chrome && window.chrome.webview)
        window.chrome.webview.postMessage(JSON.stringify(payload));
    } catch (error) {
      // WebView2 channel failure must not take down the player window.
    }
  }

  function showNotification(itemId, delta) {
    if (!notifications) return;

    var amount = Math.abs(Number(delta) || 0);
    var item = AssistInventory.itemDefinition(catalog, itemId);
    var type = Number(delta) > 0 ? "add" : "remove";

    var toast = document.createElement("div");
    toast.className = "inventoryNotification " + type + " in";
    toast.innerHTML =
      "<div class='inventoryNotificationTitle'>" +
        (type === "add" ? "Получено" : "Изъято") + "</div>" +
      "<div class='inventoryNotificationName'>" +
        AssistInventory.escapeHtml(item.name || itemId) + " ×" + amount + "</div>";

    notifications.appendChild(toast);

    window.setTimeout(function () {
      toast.classList.add("closing");
      window.setTimeout(function () { toast.remove(); }, 260);
    }, 1800);
  }

  function handleMessage(raw) {
    var message;

    try {
      message = typeof raw === "string" ? JSON.parse(raw) : raw;
    } catch (error) {
      return;
    }

    if (!message) return;

    if (message.type === "snapshot") {
      snapshot = message.snapshot || null;
      catalog = Array.isArray(message.itemCatalog) ? message.itemCatalog : [];
      // Скорости шкал приходят отдельно от самого снимка: их считает домен, а
      // окно «Игрок» показывает разметку шкал ТЕМ ЖЕ модулем, что и Симулятор —
      // значит и подсказка с «ед./мин» должна работать здесь так же.
      if (snapshot && message.conditionRates) {
        snapshot.conditionRates = message.conditionRates;
      }
      render();
      return;
    }

    if (message.type === "inventory_notification") {
      showNotification(message.itemId, message.delta);
    }
  }

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", function (event) {
      handleMessage(event.data);
    });
  }

  window.addEventListener("message", function (event) {
    handleMessage(event.data);
  });

  send({ action: "inventory_ready" });

  var HOTKEY_CODES = new Set(["KeyI", "Escape"]);
  var HOTKEY_KEYS = new Set(["i", "ш"]);

  document.addEventListener("keydown", function (event) {
    if (event.repeat) return;

    var tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
        (event.target && event.target.isContentEditable)) {
      return;
    }

    var isHotkey =
      HOTKEY_CODES.has(event.code) ||
      HOTKEY_KEYS.has(String(event.key || "").toLowerCase());

    if (!isHotkey) return;

    event.preventDefault();
    send({ action: "close_inventory" });
  });

  render();
})();
</script>
</body>
</html>
