<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка перекрёстков</title><link rel="stylesheet" href="theme.css?v=c1d1848c">
<style>
/* Страница целиком про карту: заголовков и карточек нет, потому что окно
   открывается ради одной задачи — пройти по узлам и отметить лишние. */
html, body { height: 100%; margin: 0; overflow: hidden; background: #0d1014; }
#junctionRoot { display: grid; grid-template-rows: auto 1fr; height: 100%; }

#junctionBar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid var(--border, #222831);
  background: #111419;
}

#junctionCanvasHost { position: relative; overflow: hidden; }
#junctionCanvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

/* Плашка состояния: сколько узлов, какой выбран, что записано в файл. */
#junctionStatus { margin-left: auto; font-size: 12px; color: #9aa4b2; white-space: nowrap; }
#junctionCounter { font-weight: 600; color: #e6e8ea; }

/* Радиобокс режимов: режим меняет СМЫСЛ клика по карте, поэтому он вынесен в
   начало панели и подписан — иначе автор не поймёт, почему клик ничего не делает. */
#junctionModes {
  display: flex; align-items: center; gap: 10px; padding: 3px 10px;
  border: 1px solid var(--border, #222831); border-radius: 6px; background: #0d1014;
}
#junctionModes label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }

/* Кнопки полигона видны ТОЛЬКО в режиме выделения: в остальных они
   недействительны, а неактивные кнопки на панели только путают. */
#junctionPolygonActions { display: none; align-items: center; gap: 6px; }
#junctionPolygonActions.visible { display: flex; }
</style>
</head>
<body>
<div id="junctionRoot">
  <div id="junctionBar">
    <div id="junctionModes" title="Режим определяет, что делает клик по карте">
      <label title="Рисовать многоугольник: клик — вершина, замыкание на первой точке выделяет все узлы внутри">
        <input type="radio" name="junctionMode" value="polygon"> Выделение
      </label>
      <label title="Клик по узлу сразу исключает его, без кнопок">
        <input type="radio" name="junctionMode" value="delete"> Удаление
      </label>
      <label title="Клик по пустому месту добавляет перекрёсток, повторный клик убирает">
        <input type="radio" name="junctionMode" value="add" checked> Добавление
      </label>
    </div>
    <div id="junctionPolygonActions">
      <button class="toolButton" id="junctionPolygonClose" type="button" title="Замкнуть многоугольник: выделить все узлы внутри него">Замкнуть</button>
      <button class="toolButton" id="junctionPolygonClear" type="button" title="Стереть нарисованный многоугольник и снять выделение">Очистить полигон</button>
    </div>
    <button class="toolButton" id="junctionPrev" type="button" title="Предыдущий перекрёсток">◀ предыдущий</button>
    <button class="toolButton" id="junctionNext" type="button" title="Следующий перекрёсток">следующий ▶</button>
    <button class="toolButton" id="junctionExclude" type="button" title="Исключить выбранные узлы: они не будут считаться перекрёстками">Исключить выбранные</button>
    <button class="toolButton" id="junctionRestore" type="button" title="Вернуть выбранные узлы в список: снять пометку «исключён»">Вернуть</button>
    <button class="toolButton primary" id="junctionSave" type="button" title="Записать правки в файл">Сохранить правки</button>
    <button class="toolButton" id="junctionReload" type="button" title="Перечитать файл правок с диска">Перечитать</button>
    <button class="toolButton" id="junctionFitAll" type="button" title="Показать всю карту">Вся карта</button>
    <div id="junctionStatus">
      <span id="junctionCounter">0 / 0</span>
      <span id="junctionHint"> · клик по узлу — выбрать, Ctrl+клик — мультивыбор, клик по пустому месту — добавить узел</span>
    </div>
  </div>
  <div id="junctionCanvasHost"><canvas id="junctionCanvas"></canvas></div>
</div>
<script src="web_log.js?v=18763af3"></script>
<script src="junctions.js?v=02220424"></script>
</body></html>
