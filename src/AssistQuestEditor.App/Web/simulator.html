<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Симулятор</title>
<link rel="stylesheet" href="theme.css?v=1.0.40.126">
<style>
  .mapSurface { position:relative; overflow:hidden; }
  #mapCanvas { display:block; width:100%; height:100%; cursor:default; touch-action:none; background:#0d1014; }
</style>
</head>
<body>
<div class="app">
  <header class="simTop">
    <div>
      <div class="simTitle">Симулятор — искусственный игровой мир</div>
      <div class="simSub">СДО fixture → Data Channels → Quest Runtime → редакторы</div>
    </div>
    <div class="topSpacer"></div>
    <div class="hud" id="hud"></div>
    <button class="toolButton" id="reset">Сбросить</button>
  </header>
  <div class="simBody">
    <aside class="runtimeSide" id="runtimeSide"></aside>
    <section class="mapSurface" id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div class="mapLegend">
        <b>Игровой мир</b><br>
        СДО — статические точки ETS2 Assist · города — отдельный ориентир · дорог нет<br>
        ЛКМ: выбрать СДО · тянуть оранжевую точку: игрок · колесо: масштаб · СКМ/ПКМ: панорама
      </div>
    </section>
    <aside class="simSide" id="side"></aside>
  </div>
  <div id="interfaceLayer" class="interfaceLayer" aria-live="polite"></div>
</div>
<script src="web_log.js?v=1.0.40.126"></script>
<script src="simulator.js?v=1.0.40.126"></script>
<script src="interface.js?v=1.0.40.126"></script>
</body>
</html>
