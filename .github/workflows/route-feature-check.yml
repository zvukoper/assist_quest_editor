name: Route feature check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Recurse -File -Filter *.csproj)
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Полная Release-сборка App запускает существующий VerifyDataResources target.
          # В PATH runner сначала ставим Windows PowerShell 5.1, чтобы его встроенный
          # Get-FileHash корректно отработал внутри ci/sync_data_resources.ps1.
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0'
          $env:PATH = $windowsPowerShell + ';' + $env:PATH
          dotnet build .\src\AssistQuestEditor.Domain\AssistQuestEditor.Domain.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\AssistQuestEditor.App\AssistQuestEditor.App.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          foreach ($test in $tests) {
            dotnet restore $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Web syntax
        shell: pwsh
        run: |
          node --check .\src\AssistQuestEditor.App\Web\simulator.js
          node --check .\src\AssistQuestEditor.App\Web\inventory.js
          node --check .\src\AssistQuestEditor.App\Web\playerPanels.js
