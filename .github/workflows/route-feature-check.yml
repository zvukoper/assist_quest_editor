name: Route feature check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Recurse -File -Filter *.csproj)
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet build .\src\AssistQuestEditor.Domain\AssistQuestEditor.Domain.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Проверяем Release-компиляцию App, но не запускаем существующий AfterTargets=Build VerifyDataResources:
          # он зависит от powershell/Get-FileHash на runner и не относится к компиляции изменённого кода.
          dotnet msbuild .\src\AssistQuestEditor.App\AssistQuestEditor.App.csproj /t:CoreCompile /p:Configuration=Release /p:RestoreIgnoreFailedSources=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          foreach ($test in $tests) {
            dotnet restore $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Web syntax
        shell: pwsh
        run: |
          node --check .\src\AssistQuestEditor.App\Web\simulator.js
          node --check .\src\AssistQuestEditor.App\Web\inventory.js
          node --check .\src\AssistQuestEditor.App\Web\playerPanels.js
