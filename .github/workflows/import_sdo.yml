name: Импорт СДО

on:
  push:
    branches:
      - main
    paths:
      - ci/import_sdo.mjs
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    name: Импортировать СДО из ETS2 Assist
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Импортировать точки
        run: node ci/import_sdo.mjs

      - name: Зафиксировать базу СДО
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world/sdo_points.json

          if git diff --cached --quiet; then
            echo "SDO database is already up to date."
            exit 0
          fi

          git commit -m "Импортировать базу СДО из ETS2 Assist"
          git push origin HEAD:main
          gh workflow run "ci.yml" --ref main
