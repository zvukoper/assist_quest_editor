name: Проверки

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Полный набор проверок
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Проверить память проекта
        shell: pwsh
        run: node ci/validate_memory.mjs

      - name: Установить Playwright
        shell: pwsh
        run: npm install --no-save playwright@latest

      - name: Установить Chromium для Playwright
        shell: pwsh
        run: npx playwright install chromium

      - name: Playwright + Chromium smoke
        shell: pwsh
        run: node ci/playwright_smoke.mjs

      - name: Проверить контракт simulator ↔ editor
        shell: pwsh
        run: node ci/selection_context_smoke.mjs

      - name: Quest Graph Playwright smoke
        shell: pwsh
        run: node ci/quest_graph_smoke.mjs

      - name: Проверить синтаксис web JavaScript
        shell: pwsh
        run: |
          node --check .\src\AssistQuestEditor.App\Web\main.js
          node --check .\src\AssistQuestEditor.App\Web\editor.js
          node --check .\src\AssistQuestEditor.App\Web\simulator.js


      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Собрать исходные проекты .NET
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Recurse -File -Filter *.csproj)
          if ($projects.Count -eq 0) {
            Write-Error "В src нет C# проектов."
            exit 1
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet build $project.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Выполнить тесты домена
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          if ($tests.Count -eq 0) {
            Write-Error "В tests нет C# тестовых проектов."
            exit 1
          }

          foreach ($test in $tests) {
            dotnet restore $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Проверить compile.ps1 как single-file публикацию
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\compile.ps1 -NoLaunch
          $publish = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net10.0-windows\win-x64\publish'
          $files = @(Get-ChildItem -LiteralPath $publish -File -Force)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
            Write-Error "compile.ps1 не создал ровно один EXE."
            $files | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Single-file публикация CI: $($files[0].FullName)" -ForegroundColor Green

      - name: Проверить структуру диагностических логов
        shell: pwsh
        run: |
          $unexpected = @(Get-ChildItem -Path MemoryAI/LOGS -File | Where-Object { $_.Name -ne "README.md" -and $_.Name -ne "assist_quest_editor.log" })
          if ($unexpected.Count -gt 0) {
            Write-Error "MemoryAI/LOGS должен содержать README.md и, при наличии физического теста, assist_quest_editor.log."
            $unexpected | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
