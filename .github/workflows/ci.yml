name: Проверки

# Проверки запускаются только вручную.
#
# Основной барьер перед сборкой — локальный прогон `ci/run_local.ps1`: он
# повторяет тот же набор проверок и вызывается из `pull.ps1` до `compile.ps1`.
# Автозапуск по push отключён, чтобы каждый commit не занимал Windows runner.
#
# GitHub CI остаётся нужен для того, чего локально получить нельзя:
#   - чистая среда `windows-latest` без локальных кешей и untracked-файлов;
#   - зафиксированный Node.js 22 из workflow, а не версия с этой машины.
on:
  workflow_dispatch:

# Не держим одновременно несколько одинаковых ручных запусков:
# новый запуск отменяет предыдущий незавершённый.
concurrency:
  group: assist-quest-editor-manual
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Полный набор проверок
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Установить Playwright
        id: playwright_install
        continue-on-error: true
        shell: pwsh
        run: npm install --no-save playwright@1.57.0

      - name: Кэш браузера Playwright
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.57.0

      - name: Установить Chromium для Playwright
        id: chromium_install
        continue-on-error: true
        shell: pwsh
        run: npx playwright install chromium

      - name: Playwright + Chromium smoke
        id: playwright_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/playwright_smoke.mjs

      - name: Проверить контракт simulator ↔ editor
        id: selection_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/selection_context_smoke.mjs

      - name: Quest Graph Playwright smoke
        id: quest_graph_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/quest_graph_smoke.mjs

      - name: Scene Graph Playwright smoke
        id: scene_graph_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/scene_graph_smoke.mjs

      - name: Dialogue Workspace Playwright smoke
        id: dialogue_workspace_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/dialogue_workspace_smoke.mjs

      - name: Навигация Quest ↔ Scene resource smoke
        id: resource_navigation_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/resource_navigation_smoke.mjs

      - name: Scene interface Playwright smoke
        id: scene_interface_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/scene_interface_smoke.mjs

      - name: Pan следует за курсором
        id: pan_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/pan_smoke.mjs

      - name: Целостность Quest Graph и сцен
        id: quest_graph_integrity
        continue-on-error: true
        shell: pwsh
        run: node ci/check_quest_graph.mjs

      - name: Правила репутации в контенте
        id: reputation_flow
        continue-on-error: true
        shell: pwsh
        run: node ci/reputation_flow.mjs

      - name: Проверить синтаксис web JavaScript
        id: web_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          node --check .\src\AssistQuestEditor.App\Web\main.js
          node --check .\src\AssistQuestEditor.App\Web\editor.js
          node --check .\src\AssistQuestEditor.App\Web\sceneEditor.js
          node --check .\src\AssistQuestEditor.App\Web\dialogueWorkspace.js
          node --check .\src\AssistQuestEditor.App\Web\simulator.js


      - name: .NET SDK
        id: dotnet_sdk
        continue-on-error: true
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Собрать исходные проекты .NET
        id: dotnet_build
        continue-on-error: true
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Recurse -File -Filter *.csproj)
          if ($projects.Count -eq 0) {
            Write-Error "В src нет C# проектов."
            exit 1
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet build $project.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Выполнить тесты домена
        id: dotnet_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          if ($tests.Count -eq 0) {
            Write-Error "В tests нет C# тестовых проектов."
            exit 1
          }

          $resultDir = Join-Path $env:GITHUB_WORKSPACE 'ci-results\\domain-tests'
          New-Item -ItemType Directory -Path $resultDir -Force | Out-Null

          foreach ($test in $tests) {
            dotnet restore $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $trxName = $test.BaseName + '.trx'
            dotnet test $test.FullName --configuration Release --no-restore --logger "trx;LogFileName=$trxName" --results-directory $resultDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Проверить compile.ps1 как single-file публикацию
        id: publish
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\compile.ps1 -NoLaunch
          $publish = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net10.0-windows\win-x64\publish'
          $files = @(Get-ChildItem -LiteralPath $publish -File -Force)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
            Write-Error "compile.ps1 не создал ровно один EXE."
            $files | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Single-file публикация CI: $($files[0].FullName)" -ForegroundColor Green

      - name: Финальная проверка CI
        id: final_gate
        if: always()
        shell: pwsh
        env:
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium_install.outcome }}
          PLAYWRIGHT_SMOKE_OUTCOME: ${{ steps.playwright_smoke.outcome }}
          SELECTION_SMOKE_OUTCOME: ${{ steps.selection_smoke.outcome }}
          QUEST_GRAPH_SMOKE_OUTCOME: ${{ steps.quest_graph_smoke.outcome }}
          SCENE_GRAPH_SMOKE_OUTCOME: ${{ steps.scene_graph_smoke.outcome }}
          DIALOGUE_WORKSPACE_SMOKE_OUTCOME: ${{ steps.dialogue_workspace_smoke.outcome }}
          RESOURCE_NAVIGATION_SMOKE_OUTCOME: ${{ steps.resource_navigation_smoke.outcome }}
          PAN_SMOKE_OUTCOME: ${{ steps.pan_smoke.outcome }}
          QUEST_GRAPH_INTEGRITY_OUTCOME: ${{ steps.quest_graph_integrity.outcome }}
          REPUTATION_FLOW_OUTCOME: ${{ steps.reputation_flow.outcome }}
          SCENE_INTERFACE_SMOKE_OUTCOME: ${{ steps.scene_interface_smoke.outcome }}
          WEB_SYNTAX_OUTCOME: ${{ steps.web_syntax.outcome }}
          DOTNET_SDK_OUTCOME: ${{ steps.dotnet_sdk.outcome }}
          DOTNET_BUILD_OUTCOME: ${{ steps.dotnet_build.outcome }}
          DOTNET_TESTS_OUTCOME: ${{ steps.dotnet_tests.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          $failed = @()
          $checks = @(
            @{ Name = 'Playwright install'; Outcome = $env:PLAYWRIGHT_INSTALL_OUTCOME },
            @{ Name = 'Chromium install'; Outcome = $env:CHROMIUM_INSTALL_OUTCOME },
            @{ Name = 'Playwright smoke'; Outcome = $env:PLAYWRIGHT_SMOKE_OUTCOME },
            @{ Name = 'Simulator ↔ Editor contract'; Outcome = $env:SELECTION_SMOKE_OUTCOME },
            @{ Name = 'Quest Graph UI smoke'; Outcome = $env:QUEST_GRAPH_SMOKE_OUTCOME },
            @{ Name = 'Scene Graph UI smoke'; Outcome = $env:SCENE_GRAPH_SMOKE_OUTCOME },
            @{ Name = 'Dialogue Workspace UI smoke'; Outcome = $env:DIALOGUE_WORKSPACE_SMOKE_OUTCOME },
            @{ Name = 'Resource navigation smoke'; Outcome = $env:RESOURCE_NAVIGATION_SMOKE_OUTCOME },
            @{ Name = 'Scene interface UI smoke'; Outcome = $env:SCENE_INTERFACE_SMOKE_OUTCOME },
            @{ Name = 'Pan follows cursor'; Outcome = $env:PAN_SMOKE_OUTCOME },
            @{ Name = 'Quest graph & scene integrity'; Outcome = $env:QUEST_GRAPH_INTEGRITY_OUTCOME },
            @{ Name = 'Reputation content rules'; Outcome = $env:REPUTATION_FLOW_OUTCOME },
            @{ Name = 'Web JavaScript syntax'; Outcome = $env:WEB_SYNTAX_OUTCOME },
            @{ Name = '.NET SDK'; Outcome = $env:DOTNET_SDK_OUTCOME },
            @{ Name = '.NET build'; Outcome = $env:DOTNET_BUILD_OUTCOME },
            @{ Name = '.NET domain tests'; Outcome = $env:DOTNET_TESTS_OUTCOME },
            @{ Name = 'Single-file publish'; Outcome = $env:PUBLISH_OUTCOME }
          )
          foreach ($check in $checks) {
            if ($check.Outcome -eq 'failure') { $failed += $check.Name }
          }

          # Пишем сводку в summary запуска: без этого падение видно только в
          # логах, а аннотация содержит лишь «exit code 1» без имени проверки.
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrWhiteSpace($summaryPath)) {
            $lines = New-Object System.Collections.Generic.List[string]
            $lines.Add('| Проверка | Результат |')
            $lines.Add('|---|---|')
            foreach ($check in $checks) {
              $state = if ($check.Outcome -eq 'failure') { 'ошибка' } else { 'успех' }
              $lines.Add('| ' + $check.Name + ' | ' + $state + ' |')
            }
            if ($failed.Count -gt 0) {
              $lines.Add('')
              $lines.Add('**Ошибки:** ' + ($failed -join ', '))
            }
            $lines | Add-Content -Path $summaryPath -Encoding utf8
          }

          if ($failed.Count -gt 0) {
            Write-Error ('CI завершён с ошибками: ' + ($failed -join ', '))
            exit 1
          }
          Write-Host 'CI: все обязательные проверки успешны.' -ForegroundColor Green
