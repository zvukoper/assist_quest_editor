name: Проверки

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Полный набор проверок
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Проверить память проекта
        id: memory
        continue-on-error: true
        shell: pwsh
        run: node ci/validate_memory.mjs

      - name: Установить Playwright
        id: playwright_install
        continue-on-error: true
        shell: pwsh
        run: npm install --no-save playwright@1.57.0

      - name: Установить Chromium для Playwright
        id: chromium_install
        continue-on-error: true
        shell: pwsh
        run: npx playwright install chromium

      - name: Playwright + Chromium smoke
        id: playwright_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/playwright_smoke.mjs

      - name: Проверить контракт simulator ↔ editor
        id: selection_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/selection_context_smoke.mjs

      - name: Quest Graph Playwright smoke
        id: quest_graph_smoke
        continue-on-error: true
        shell: pwsh
        run: node ci/quest_graph_smoke.mjs

      - name: Проверить синтаксис web JavaScript
        id: web_syntax
        continue-on-error: true
        shell: pwsh
        run: |
          node --check .\src\AssistQuestEditor.App\Web\main.js
          node --check .\src\AssistQuestEditor.App\Web\editor.js
          node --check .\src\AssistQuestEditor.App\Web\simulator.js


      - name: .NET SDK
        id: dotnet_sdk
        continue-on-error: true
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Собрать исходные проекты .NET
        id: dotnet_build
        continue-on-error: true
        shell: pwsh
        run: |
          $projects = @(Get-ChildItem -Path src -Recurse -File -Filter *.csproj)
          if ($projects.Count -eq 0) {
            Write-Error "В src нет C# проектов."
            exit 1
          }

          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet build $project.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Выполнить тесты домена
        id: dotnet_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          if ($tests.Count -eq 0) {
            Write-Error "В tests нет C# тестовых проектов."
            exit 1
          }

          foreach ($test in $tests) {
            dotnet restore $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            dotnet test $test.FullName --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Матрица из семи сценариев Quest Editor
        id: quest_scenarios
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path tests -Recurse -File -Filter *.csproj)
          if ($tests.Count -eq 0) { Write-Error "В tests нет C# тестовых проектов."; exit 1 }
          $resultDir = Join-Path $env:GITHUB_WORKSPACE 'ci-results\\quest-scenarios'
          New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
          $failed = $false
          foreach ($test in $tests) {
            dotnet test $test.FullName --configuration Release --no-restore --no-build --filter "FullyQualifiedName~AssistQuestEditor.Domain.Tests.QuestRuntimeTests.Scenario" --logger "trx;LogFileName=quest-scenarios.trx" --results-directory $resultDir
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Проверить compile.ps1 как single-file публикацию
        id: publish
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\compile.ps1 -NoLaunch
          $publish = Join-Path $env:GITHUB_WORKSPACE 'bin\Release\net10.0-windows\win-x64\publish'
          $files = @(Get-ChildItem -LiteralPath $publish -File -Force)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
            Write-Error "compile.ps1 не создал ровно один EXE."
            $files | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Single-file публикация CI: $($files[0].FullName)" -ForegroundColor Green

      - name: Сформировать сводный лог автоматических тестов
        id: automated_report
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          MEMORY_OUTCOME: ${{ steps.memory.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium_install.outcome }}
          PLAYWRIGHT_SMOKE_OUTCOME: ${{ steps.playwright_smoke.outcome }}
          SELECTION_SMOKE_OUTCOME: ${{ steps.selection_smoke.outcome }}
          QUEST_GRAPH_SMOKE_OUTCOME: ${{ steps.quest_graph_smoke.outcome }}
          WEB_SYNTAX_OUTCOME: ${{ steps.web_syntax.outcome }}
          DOTNET_SDK_OUTCOME: ${{ steps.dotnet_sdk.outcome }}
          DOTNET_BUILD_OUTCOME: ${{ steps.dotnet_build.outcome }}
          DOTNET_TESTS_OUTCOME: ${{ steps.dotnet_tests.outcome }}
          QUEST_SCENARIOS_OUTCOME: ${{ steps.quest_scenarios.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:GITHUB_WORKSPACE 'MemoryAI\\LOGS\\assist_quest_editor.log'
          $logDir = Split-Path -Parent $logPath
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          $lines = @(
            '',
            '=== CI AUTOMATED TEST REPORT ===',
            ('Commit=' + $env:GITHUB_SHA),
            ('Workflow=' + $env:GITHUB_RUN_ID),
            ('GeneratedUtc=' + [DateTime]::UtcNow.ToString('O')),
            '',
            ('Memory validation — ' + $env:MEMORY_OUTCOME),
            ('Playwright install — ' + $env:PLAYWRIGHT_INSTALL_OUTCOME),
            ('Chromium install — ' + $env:CHROMIUM_INSTALL_OUTCOME),
            ('Playwright smoke — ' + $env:PLAYWRIGHT_SMOKE_OUTCOME),
            ('Simulator ↔ Editor contract — ' + $env:SELECTION_SMOKE_OUTCOME),
            ('Quest Graph UI smoke — ' + $env:QUEST_GRAPH_SMOKE_OUTCOME),
            ('Web JavaScript syntax — ' + $env:WEB_SYNTAX_OUTCOME),
            ('.NET SDK — ' + $env:DOTNET_SDK_OUTCOME),
            ('.NET build — ' + $env:DOTNET_BUILD_OUTCOME),
            ('.NET domain tests — ' + $env:DOTNET_TESTS_OUTCOME),
            ('Quest scenario matrix step — ' + $env:QUEST_SCENARIOS_OUTCOME),
            ('Single-file publish — ' + $env:PUBLISH_OUTCOME),
            '',
            '=== QUEST SCENARIO MATRIX ==='
          )
          $scenarioNames = [ordered]@{
            'Scenario01_Graph' = '1 Graph'
            'Scenario02_Parameters' = '2 Parameters'
            'Scenario03_SimpleRuntime' = '3 Simple Runtime'
            'Scenario04_Interaction' = '4 Interaction'
            'Scenario05_Event' = '5 Event'
            'Scenario06_Choice' = '6 Choice'
            'Scenario07_SaveLoad' = '7 Save/Load'
          }
          $trxPath = Join-Path $env:GITHUB_WORKSPACE 'ci-results\\quest-scenarios\\quest-scenarios.trx'
          $results = @()
          if (Test-Path -LiteralPath $trxPath) {
            [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
            $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          }
          foreach ($pair in $scenarioNames.GetEnumerator()) {
            $match = @($results | Where-Object { $_.testName -like ('*' + $pair.Key + '*') } | Select-Object -First 1)
            if ($match.Count -eq 0) {
              $status = 'BLOCKED'
              $details = 'test result not produced'
            } else {
              $status = switch ([string]$match[0].outcome) {
                'Passed' { 'PASS' }
                'Failed' { 'FAIL' }
                'NotExecuted' { 'SKIP' }
                default { [string]$match[0].outcome }
              }
              $details = [string]$match[0].testName
              if ($status -eq 'FAIL') {
                $errorMessage = [string]$match[0].Output.ErrorInfo.Message
                if (-not [string]::IsNullOrWhiteSpace($errorMessage)) {
                  $details = $errorMessage.Replace([Environment]::NewLine, ' ')
                }
              }
            }
            $lines += ($pair.Value + ' — ' + $status + ' | ' + $details)
          }
          $lines += @(
            '',
            'Визуально проверяются отдельно: перенос/масштабирование UI, фактический drag курсором, выбор точки мышью, читаемость панелей и прочее поведение, которое CI не может надёжно подтвердить.',
            '=== END CI AUTOMATED TEST REPORT ==='
          )
          [File]::AppendAllText($logPath, (($lines -join [Environment]::NewLine) + [Environment]::NewLine), [System.Text.UTF8Encoding]::new($false))
          Write-Host ('Сводный лог автотестов записан: ' + $logPath)

      - name: Проверить структуру диагностических логов
        id: log_structure
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $unexpected = @(Get-ChildItem -Path MemoryAI/LOGS -File | Where-Object { $_.Name -ne "README.md" -and $_.Name -ne "assist_quest_editor.log" })
          if ($unexpected.Count -gt 0) {
            Write-Error "MemoryAI/LOGS содержит неожиданные файлы."
            $unexpected | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          if (-not (Test-Path -LiteralPath MemoryAI/LOGS/assist_quest_editor.log)) {
            Write-Error "Сводный диагностический лог не создан."
            exit 1
          }

      - name: Загрузить диагностический лог автотестов
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: assist-quest-editor-ci-diagnostics
          path: |
            MemoryAI/LOGS/assist_quest_editor.log
            ci-results/**/*.trx
          if-no-files-found: warn

      - name: Финальная проверка CI
        id: final_gate
        if: always()
        shell: pwsh
        env:
          MEMORY_OUTCOME: ${{ steps.memory.outcome }}
          PLAYWRIGHT_INSTALL_OUTCOME: ${{ steps.playwright_install.outcome }}
          CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium_install.outcome }}
          PLAYWRIGHT_SMOKE_OUTCOME: ${{ steps.playwright_smoke.outcome }}
          SELECTION_SMOKE_OUTCOME: ${{ steps.selection_smoke.outcome }}
          QUEST_GRAPH_SMOKE_OUTCOME: ${{ steps.quest_graph_smoke.outcome }}
          WEB_SYNTAX_OUTCOME: ${{ steps.web_syntax.outcome }}
          DOTNET_SDK_OUTCOME: ${{ steps.dotnet_sdk.outcome }}
          DOTNET_BUILD_OUTCOME: ${{ steps.dotnet_build.outcome }}
          DOTNET_TESTS_OUTCOME: ${{ steps.dotnet_tests.outcome }}
          QUEST_SCENARIOS_OUTCOME: ${{ steps.quest_scenarios.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          AUTOMATED_REPORT_OUTCOME: ${{ steps.automated_report.outcome }}
          LOG_STRUCTURE_OUTCOME: ${{ steps.log_structure.outcome }}
          UPLOAD_DIAGNOSTICS_OUTCOME: ${{ steps.upload_diagnostics.outcome }}
        run: |
          $failed = @()
          $checks = @(
            @{ Name = 'Memory validation'; Outcome = $env:MEMORY_OUTCOME },
            @{ Name = 'Playwright install'; Outcome = $env:PLAYWRIGHT_INSTALL_OUTCOME },
            @{ Name = 'Chromium install'; Outcome = $env:CHROMIUM_INSTALL_OUTCOME },
            @{ Name = 'Playwright smoke'; Outcome = $env:PLAYWRIGHT_SMOKE_OUTCOME },
            @{ Name = 'Simulator ↔ Editor contract'; Outcome = $env:SELECTION_SMOKE_OUTCOME },
            @{ Name = 'Quest Graph UI smoke'; Outcome = $env:QUEST_GRAPH_SMOKE_OUTCOME },
            @{ Name = 'Web JavaScript syntax'; Outcome = $env:WEB_SYNTAX_OUTCOME },
            @{ Name = '.NET SDK'; Outcome = $env:DOTNET_SDK_OUTCOME },
            @{ Name = '.NET build'; Outcome = $env:DOTNET_BUILD_OUTCOME },
            @{ Name = '.NET domain tests'; Outcome = $env:DOTNET_TESTS_OUTCOME },
            @{ Name = 'Quest scenario matrix'; Outcome = $env:QUEST_SCENARIOS_OUTCOME },
            @{ Name = 'Single-file publish'; Outcome = $env:PUBLISH_OUTCOME },
            @{ Name = 'Automated report'; Outcome = $env:AUTOMATED_REPORT_OUTCOME },
            @{ Name = 'Log structure'; Outcome = $env:LOG_STRUCTURE_OUTCOME },
            @{ Name = 'Diagnostic artifact upload'; Outcome = $env:UPLOAD_DIAGNOSTICS_OUTCOME }
          )
          foreach ($check in $checks) {
            if ($check.Outcome -eq 'failure') { $failed += $check.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Error ('CI завершён с ошибками: ' + ($failed -join ', '))
            exit 1
          }
          Write-Host 'CI: все обязательные проверки успешны.' -ForegroundColor Green
